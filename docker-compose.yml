version: '3.8'

services:
  app:
    build:
      context: .
    container_name: radiant-health-app
    ports:
      - "3002:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: radiant_user
      DB_PASSWORD: secret
      DB_DATABASE: radiant_health_db
      SESSION_SECRET: radiant-local-dev-secret
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - radiant-hospital-network
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  mysql:
    image: mysql:8.0
    container_name: radiant-health-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: radiant_health_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: radiant_user
      MYSQL_PASSWORD: secret
    ports:
      - "3309:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./localhost.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - radiant-hospital-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: radiant-health-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - mysql
    networks:
      - radiant-hospital-network

networks:
  radiant-hospital-network:
    driver: bridge

volumes:
  dbdata:
